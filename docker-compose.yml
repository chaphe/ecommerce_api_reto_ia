services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-api:1.0.0
    container_name: ecommerce_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-password123}@db:3306/${MYSQL_DATABASE:-ecommerce_db}
      DISCOUNT_THRESHOLD: ${DISCOUNT_THRESHOLD:-100}
      DISCOUNT_RATE: ${DISCOUNT_RATE:-0.10}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecommerce_net

  db:
    image: mysql:8
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - ecommerce_net

volumes:
  mysql_data:

networks:
  ecommerce_net:
    driver: bridge
    name: ecommerce_internal
