<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Northstar Store{% endblock %}</title>
    <script>
      tailwind = { config: { darkMode: "class" } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased transition-colors dark:bg-slate-950 dark:text-slate-100">
    <header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/85 backdrop-blur dark:border-slate-800/80 dark:bg-slate-950/85">
      <nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 lg:px-8" aria-label="Navegación principal">
        <a href="/" class="flex items-center gap-3 font-semibold tracking-tight">
          <span class="grid h-9 w-9 place-items-center rounded-xl bg-indigo-600 text-sm text-white shadow-lg shadow-indigo-600/25">N</span>
          <span>Northstar <span class="text-indigo-500">Store</span></span>
        </a>
        <div class="flex items-center gap-2">
          <a href="/" class="hidden rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 sm:block">Catálogo</a>
          <a href="/orders" class="rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Mis pedidos</a>
          <a href="/profile" class="hidden rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 sm:block">Perfil</a>
          <a href="/login" class="rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Iniciar sesión</a>
          <a href="/admin" class="hidden rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 md:block">Administración</a>
          {% block nav_actions %}{% endblock %}
          <button id="theme-toggle" type="button" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800" aria-label="Cambiar tema">
            <span id="theme-icon" aria-hidden="true">◐</span>
          </button>
        </div>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer class="border-t border-slate-200 bg-white px-5 py-8 text-sm text-slate-500 dark:border-slate-800 dark:bg-slate-950 lg:px-8">
      <div class="mx-auto flex max-w-7xl flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
        <span class="font-medium text-slate-700 dark:text-slate-300">Northstar Store</span>
        <span>Una experiencia de compra simple y clara.</span>
      </div>
    </footer>
    <div id="toast" class="pointer-events-none fixed bottom-5 right-5 z-50 translate-y-4 rounded-xl bg-slate-900 px-4 py-3 text-sm text-white opacity-0 shadow-xl transition-all dark:bg-white dark:text-slate-900" role="status"></div>
    <script src="{{ url_for('static', path='app.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
